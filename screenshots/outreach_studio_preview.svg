  <text x="67" y="118" fill="#1d4ed8" font-family="system-ui, sans-serif" font-weight="bold" font-size="14">HC</text>
  <text x="110" y="106" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="bold" font-size="14">Hybrid Calisthenics (Hampton)</text>
  <rect x="330" y="93" width="50" height="18" rx="9" fill="#d1fae5" stroke="#a7f3d0" />
  <text x="342" y="106" fill="#065f46" font-family="system-ui, sans-serif" font-weight="bold" font-size="10">PASS</text>
