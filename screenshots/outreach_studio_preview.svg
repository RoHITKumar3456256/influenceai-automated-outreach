  <g transform="translate(40, 160)">
    <!-- Email Card -->
    <rect x="0" y="0" width="700" height="310" rx="12" fill="#ffffff" stroke="#e2e8f0" />
    <text x="24" y="32" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="bold" font-size="14">Personalized Email Draft</text>
    <rect x="490" y="18" width="105" height="22" rx="11" fill="#ecfdf5" stroke="#a7f3d0" />
    <text x="502" y="33" fill="#047857" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">76 / 60–90 words</text>
    <rect x="605" y="18" width="75" height="22" rx="6" fill="#f1f5f9" />
    <text x="617" y="33" fill="#334155" font-family="system-ui, sans-serif" font-weight="semibold" font-size="10">Copy Email</text>

