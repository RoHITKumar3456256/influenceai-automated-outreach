    <text x="36" y="156" fill="#334155" font-family="system-ui, sans-serif" font-size="11">Hi Hampton,</text>
    <text x="36" y="174" fill="#334155" font-family="system-ui, sans-serif" font-size="11">I have been following your channel's work in Fitness &amp; Calisthenics and appreciate your accessible tutorials.</text>
    <text x="36" y="192" fill="#334155" font-family="system-ui, sans-serif" font-size="11">We are launching an initiative at InfluenceAI focused on high-performance athletic hydration.</text>
    <text x="36" y="210" fill="#334155" font-family="system-ui, sans-serif" font-size="11">Would you be open to exploring a dedicated 60-second video integration this quarter?</text>
    <text x="36" y="228" fill="#334155" font-family="system-ui, sans-serif" font-size="11">Best regards, The InfluenceAI Team</text>

    <!-- Footer actions -->
    <rect x="24" y="260" width="110" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
    <text x="38" y="280" fill="#334155" font-family="system-ui, sans-serif" font-weight="semibold" font-size="11">Save Edits</text>
    
    <rect x="520" y="260" width="155" height="32" rx="6" fill="#10b981" />
    <text x="536" y="280" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">▶ Simulate Send Email</text>
