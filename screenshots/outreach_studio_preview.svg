    <text x="18" y="44" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Only real verified profile facts are fed into Gemini 1.5</text>
    
    <rect x="18" y="55" width="360" height="24" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="28" y="71" fill="#334155" font-family="system-ui, sans-serif" font-size="10">✓ Channel: Hybrid Calisthenics (Hampton)</text>

    <rect x="18" y="84" width="360" height="24" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="28" y="100" fill="#334155" font-family="system-ui, sans-serif" font-size="10">✓ Niche: Fitness &amp; Wellness</text>

    <rect x="18" y="113" width="360" height="24" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="28" y="129" fill="#334155" font-family="system-ui, sans-serif" font-size="10">✓ Verified Email: contact@hybridcalisthenics.com</text>

    <!-- Mobile Instagram Mock -->
    <rect x="50" y="165" width="295" height="320" rx="28" fill="#0f172a" stroke="#334155" stroke-width="3" />
    <!-- Screen -->
    <rect x="56" y="171" width="283" height="308" rx="22" fill="#ffffff" />
    <!-- IG Header -->
    <rect x="56" y="171" width="283" height="42" rx="22" fill="#ffffff" />
    <circle cx="78" cy="192" r="12" fill="url(#igG)" />
    <text x="96" y="193" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">Hampton</text>
    <text x="96" y="204" fill="#10b981" font-family="system-ui, sans-serif" font-size="9">Active now</text>

    <!-- Chat Bubble -->
    <rect x="70" y="260" width="250" height="75" rx="14" fill="#2563eb" />
    <text x="82" y="280" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">Hi Hampton, love your calisthenics tutorials!</text>
    <text x="82" y="296" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">We would love to discuss a partnership with</text>
    <text x="82" y="312" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">InfluenceAI. Can we send details to your email?</text>
    
    <text x="75" y="355" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Word count: 24 words (Constraint: 15–30)</text>

    <rect x="70" y="420" width="250" height="32" rx="8" fill="#8b5cf6" />
    <text x="135" y="440" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">▶ Simulate Send DM</text>
