  <rect x="990" y="94" width="150" height="34" rx="8" fill="#2563eb" />
  <text x="1006" y="116" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">✦ Regenerate Draft</text>

