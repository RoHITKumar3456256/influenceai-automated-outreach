    <rect x="800" y="190" width="40" height="30" rx="4" fill="#8b5cf6" />
    <text x="812" y="180" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="11">3</text>
    <text x="795" y="235" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Interested</text>
