    <text x="740" y="19" fill="#93c5fd" font-family="system-ui, sans-serif" font-weight="bold" font-size="10">✓ 9. Track</text>
    <rect x="820" y="0" width="80" height="30" rx="6" fill="#1e3a8a" stroke="#3b82f6" />
