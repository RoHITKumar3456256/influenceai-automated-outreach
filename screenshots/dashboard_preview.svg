  <text x="24" y="95" fill="#64748b" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" letter-spacing="1">MENU</text>
  
  <rect x="16" y="110" width="208" height="36" rx="8" fill="#2563eb" />
