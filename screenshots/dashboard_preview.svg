    <text x="532" y="170" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">4</text>
    <text x="525" y="235" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Draft</text>

    <rect x="590" y="140" width="40" height="80" rx="4" fill="#60a5fa" />
    <text x="602" y="130" fill="#2563eb" font-family="system-ui, sans-serif" font-size="11">8</text>
    <text x="590" y="235" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Approved</text>

    <rect x="660" y="80" width="40" height="140" rx="4" fill="#2563eb" />
    <text x="670" y="70" fill="#2563eb" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">15</text>
    <text x="660" y="235" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Simulated</text>

    <rect x="730" y="160" width="40" height="60" rx="4" fill="#10b981" />
    <text x="742" y="150" fill="#10b981" font-family="system-ui, sans-serif" font-size="11">5</text>
